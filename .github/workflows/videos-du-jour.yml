name: Vidéos du jour (page partage de l'iPhone de Diwéra)
on:
  schedule:
    - cron: "7 * * * *"      # toutes les heures
  workflow_dispatch:
permissions:
  contents: write
jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 outils/videos_du_jour.py
      - run: |
          if ! git diff --quiet partage/videos.json; then
            git config user.name "videos-du-jour"; git config user.email "actions@github.com"
            git add partage/videos.json && git commit -m "Vidéos du jour" && git push
          fi
